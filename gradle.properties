# Gradle runtime — keep heap modest so low-RAM machines can still compile.
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# ForgeGradle: merge Minecraft + Forge sources into one compile classpath.
net.minecraftforge.gradle.merge-source-sets=true


# --- Environment ---

# Must match the Forge artifact (Minecraft 1.21.1 + Forge 52.1.16).
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
forge_version=52.1.16
forge_version_range=[52,)
loader_version_range=[52,)

# Official Mojang mappings for 1.21.1.
mapping_channel=official
mapping_version=1.21.1


# --- Mod ---

mod_id=ucv
mod_name=Ultimate Combat & Vehicles
mod_license=MIT
mod_version=0.1.0
mod_group_id=com.ucv
mod_authors=umutdemirel-ui
mod_description=Original weapons, vehicles, and combat equipment for Minecraft 1.21.1 Forge.
archives_base_name=ultimatecombatvehicles
